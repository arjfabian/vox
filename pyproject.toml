[project]
name = "vox"
version = "0.4.0"
description = ""
authors = [
    { name = "José Fabián", email = "jfabian@datorum.net" }
]
dependencies = []

[project.scripts]
vox = "vox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --tb=short"
