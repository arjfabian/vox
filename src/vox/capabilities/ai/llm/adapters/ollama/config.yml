# ollama — local Ollama backend adapter configuration.
#
# Aggregated into the ai.llm CapabilityContract by LLMCapability.load_contract.
# The adapter needs no secrets: local Ollama serves without credentials.
params:
  OLLAMA_API_BASE_URL:
    description: Base URL of the local Ollama server
    type: string
    default: http://localhost:11434
  OLLAMA_MODEL:
    description: Model identifier for text generation and chat
    type: string
    default: llama3.2:1b
  OLLAMA_VISION_MODEL:
    description: Model identifier for vision inference
    type: string
    default: llava
  OLLAMA_TIMEOUT:
    description: Request timeout in seconds
    type: float
    default: 60.0