name: ai.llm
version: 1.0.0

description: |
  Provider-agnostic LLM inference port: text generation, chat completion, and
  vision inference with a built-in pipeline (prompt sanitization, semantic
  caching, RAG context injection). Concrete backends are explicit adapters
  (see `adapters/`); provider-specific configuration lives in each adapter's
  config.yml, aggregated into this contract.

provides:
  - text_generation
  - chat_completion
  - vision_inference

params:
  LLM_TEMPERATURE:
    description: Generation temperature (0.0 - 1.0)
    type: float
    default: 0.7
  LLM_MAX_TOKENS:
    description: Maximum generated tokens per response
    type: int
    default: 2048
  LLM_CACHE_ENABLED:
    description: Enable semantic response cache
    type: bool
    default: true
  LLM_CACHE_TTL:
    description: Cache entry TTL in seconds
    type: int
    default: 3600
  LLM_CACHE_DB_PATH:
    description: Absolute or project-root path to shared cache DB
    type: string
    default: var/cache/ai.llm/llm_cache.db
  LLM_RAG_ENABLED:
    description: Enable RAG context injection from workload memory
    type: bool
    default: true
  LLM_RAG_MAX_SNIPPETS:
    description: Maximum RAG snippets to inject into system prompt
    type: int
    default: 5
  LLM_MAX_INPUT_TOKENS:
    description: Maximum prompt characters before truncation
    type: int
    default: 16384