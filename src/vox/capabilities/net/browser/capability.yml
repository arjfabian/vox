name: net.browser
version: 1.0

description: >
  Headless browser capability powered by Playwright Firefox.
  Provides page capture, text extraction, and multimodal analysis.

provides:
  - browsing
  - page_capture
  - text_extraction

params:
  BROWSER_HEADLESS:
    description: Run browser in headless mode
    type: bool
    default: true

  BROWSER_TIMEOUT:
    description: Page load timeout in milliseconds
    type: int
    default: 30000
