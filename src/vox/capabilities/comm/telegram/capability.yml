name: comm.telegram
version: 1.0.0

description: |
  Telegram communication bridge for VOX agents.
  Provides bidirectional messaging, long-polling, and media delivery.

capability_class: TelegramCapability

provides:
  - messaging
  - polling
  - notifications
  - voice_input

params:
  TELEGRAM_BOT_TOKEN:
    description: Telegram Bot API token
    type: secret
    default: null
    sensitive: true
  TELEGRAM_USER_ID:
    description: Authorized Telegram user identifier
    type: string
    default: null
  TELEGRAM_LONG_TIMEOUT:
    description: Long polling timeout in seconds
    type: int
    default: 20

