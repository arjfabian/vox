name: comm.gateway
version: 0.1.0

description: |
  Multi-channel communication gateway for VOX agents.
  Provides inbound webhook ingestion and outbound message delivery
  with a unified adapter abstraction (Telegram, generic HTTP webhook).

capability_class: CommGatewayCapability

provides:
  - messaging
  - ingress
  - egress
  - webhook

params:
  GATEWAY_PORT:
    description: HTTP listen port for webhooks
    type: integer
    default: 8001
  GATEWAY_HOST:
    description: HTTP bind address
    type: string
    default: "0.0.0.0"

# Channel-specific params (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
# TELEGRAM_LONG_TIMEOUT, GATEWAY_WEBHOOK_SECRET) are declared by each adapter
# in comm/gateway/adapters/*.py and aggregated at runtime by the capability.
