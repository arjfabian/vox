name: comm.email
version: 1.0.0

description: |
  Asynchronous email dispatch capability for VOX workloads.
  Sends plain-text emails via SMTP using credentials managed by the workload
  Vault.

params:
  SMTP_HOST:
    description: SMTP server hostname
    type: string
    default: null
  SMTP_PORT:
    description: SMTP server port
    type: int
    default: 587

secrets:
  SMTP_USER:
    description: SMTP authentication username
    type: string
    required: false
  SMTP_PASS:
    description: SMTP authentication password
    type: string
    required: false

exposed_commands:
  - name: send_email
    description: "Send an automated plain-text email to a recipient."
    method: send_email
